name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check flake
        run: nix flake check
      - name: Check Python scaffold
        run: python -m py_compile tools/agentctl/agentctl.py tools/aegixtui/aegixtui.py tools/aegixai/aegixai.py tools/aegixquery/aegixquery.py tools/obsidianctl/obsidianctl.py tools/secretsctl/secretsctl.py
      - name: Run control-plane integration tests
        run: python tests/test_agentctl_integration.py
      - name: Run query shortcut integration test
        run: python tests/test_aegixquery_integration.py
